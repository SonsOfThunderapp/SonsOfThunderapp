  <!-- Opening splash (once per session) -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo-wrap">
        <img src="/assets/logo@2x.png?v=20260826-repair1"
             srcset="assets/logo@2x.png?v=20260826-repair1 1200w, assets/logo@3x.png?v=20260826-repair1 1800w"
             sizes="min(82vw, 340px)"
             alt="Sons of Thunder"

             width="1200"
             height="831" />
      </div>
      <p class="splash-line hidden" aria-hidden="true">THUNDER DOESN’T DULL</p>
    </div>
  </div>
  <script>
    /* Dad lock: opening screen must leave even if app.js never runs. */
    (function () {
      function killSplash() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('splash-done', 'splash-out', 'hidden');
        s.style.setProperty('display', 'none', 'important');
        s.style.setProperty('visibility', 'hidden', 'important');
        s.style.setProperty('pointer-events', 'none', 'important');
        s.style.setProperty('opacity', '0', 'important');
      }
      setTimeout(killSplash, 200);
      window.addEventListener('load', function () { setTimeout(killSplash, 200); });
      killSplash();
    })();
  </script>
