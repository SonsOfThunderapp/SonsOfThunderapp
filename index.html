<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thunder Board" />
  <title>Thunder Board | Sons of Thunder</title>
  <style>
    html, body { background: #000 !important; color: #fff; margin: 0; }
  </style>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Thunder Board | Sons of Thunder" />
  <meta property="og:description" content="Thunder doesn’t dull. Put this on your Home Screen." />
  <meta property="og:url" content="https://sonsofthunder.netlify.app/" />
  <meta property="og:image" content="https://sonsofthunder.netlify.app/assets/og-share.jpg" />

  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Thunder Board | Sons of Thunder" />
  <meta name="twitter:description" content="Thunder doesn’t dull. Put this on your Home Screen." />
  <meta name="twitter:image" content="https://sonsofthunder.netlify.app/assets/og-share.jpg" />
  <meta name="description" content="Sons of Thunder — Thunder doesn’t dull. Private brotherhood board." />
  
  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-v3.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192-v3.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512-v3.png" />
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" as="image" href="assets/logo@2x.png?v=20260821-sixfix1" />
  <link rel="preload" as="image" href="assets/thunder-cool-fab@2x.png?v=20260819-nogold2" />
  
  <link rel="stylesheet" href="css/styles.css?v=20260821-sixfix1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo-wrap">
        <img src="assets/logo@2x.png?v=20260821-sixfix1"
             srcset="assets/logo@2x.png?v=20260821-sixfix1 1200w, assets/logo@3x.png?v=20260821-sixfix1 1800w"
             sizes="min(82vw, 340px)"
             alt="Sons of Thunder"
             class="splash-mark splash-logo"
             width="1200"
             height="831" />
        <img class="logo-bolt-life" src="assets/logo-bolt-isolated.png?v=20260821-sixfix1" alt="" aria-hidden="true" width="1200" height="831" />
      </div>
      <p class="splash-line hidden" aria-hidden="true">THUNDER DOESN’T DULL</p>
    </div>
  </div>

  <div id="app">
    <header id="main-header" class="header">
      <div class="logo-wrap">
        <img
          src="assets/logo@2x.png?v=20260821-sixfix1"
          srcset="assets/logo@2x.png?v=20260821-sixfix1 1200w, assets/logo@3x.png?v=20260821-sixfix1 1800w"
          sizes="(max-width: 480px) 72vw, 320px"
          alt="Sons of Thunder"
          class="logo"
          id="header-logo"
          width="1200"
          height="831"
          decoding="async"
        />
        <img class="logo-bolt-life" src="assets/logo-bolt-isolated.png?v=20260821-sixfix1" alt="" aria-hidden="true" width="1200" height="831" />
      </div>
    </header>

    <main id="views">
      <section id="view-home" class="view active">
        <div class="container">
          <p class="identity-line">Thunder doesn’t dull</p>
          <p id="home-personal" class="home-personal hidden" aria-live="polite"></p>
          <div class="next-meeting card">
            <div class="card-label" id="meeting-phase-label">NEXT GATHERING</div>
            <div id="meeting-countdown" class="meeting-countdown">—</div>
            <div id="meeting-date" class="meeting-date">Calculating…</div>
            <div class="meeting-time" id="meeting-time">6:30 PM</div>
            <div class="meeting-loc" id="meeting-loc">Crooked Can Brewery Patio, Winter Garden</div>
            <p id="rsvp-prompt" class="rsvp-prompt">Your seat is open. Lock it in.</p>
            <button id="rsvp-btn" class="btn-rsvp">I'M IN</button>
            <div id="rsvp-status" class="rsvp-status hidden">⚡ YOU'RE LOCKED IN</div>
            <button type="button" id="text-leader-btn" class="btn-text-leader">HAVE A QUESTION? TEXT A LEADER</button>
          </div>
          <div class="section-title" id="announcements-title">Announcements</div>
          <div id="announcements" class="feed"></div>
          <button type="button" id="home-member-cta" class="home-member-cta" onclick="if(window.startMemberSignIn)window.startMemberSignIn();">
            <span class="home-member-cta-title">Already a Member?</span>
            <span class="home-member-cta-sub">Sign in for shared roster &amp; memories</span>
          </button>
        </div>
      </section>

      <section id="view-brothers" class="view">
        <div class="container">
          <div class="section-header">
            <h1 id="brothers-section-title">Brothers</h1>
          </div>
          <button type="button" id="auth-entry-btn" class="btn-auth-entry">SIGN IN</button>
          <div id="brothers-grid" class="brothers-grid"></div>
        </div>
      </section>

      <section id="view-events" class="view">
        <div class="container">
          <div class="memories-block" id="memories-block">
            <div class="card-label" id="memories-section-title">MEMORIES</div>
            <label for="memory-cam" id="memories-drop-btn" class="btn-rsvp">DROP A PIC</label>
            <button type="button" id="memories-library-btn" class="btn-mem-lib">From the camera roll</button>
            <div id="media-hero" class="media-hero hidden"></div>
            <div id="media-feed" class="media-feed"></div>
          </div>
          <div id="upcoming-events" class="events-list"></div>
        </div>
      </section>

      <section id="view-about" class="view">
        <div class="container about-container">
          <h1 class="about-title">WHO WE ARE</h1>
          <p class="about-text">Jesus named James and John <em>Boanerges</em> — Sons of Thunder (Mark 3:17).</p>
          <h1 class="about-title code-title">THE CODE</h1>
          <div class="code-list" id="code-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home"><span>Home</span></button>
      <button class="nav-item" data-view="brothers"><span>Brothers</span></button>
      <button class="nav-item" data-view="events"><span>Events</span></button>
      <button class="nav-item" data-view="about"><span>More</span></button>
    </nav>

    <button id="thunder-fab" class="thunder-fab" aria-label="Thunder">
      <img src="assets/thunder-cool-fab.png?v=20260819-nogold2" alt="" class="thunder-fab-img" width="80" height="80" />
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <input type="file" id="memory-cam" class="memory-cam-input" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" />
  <input type="file" id="memory-lib" class="memory-cam-input" accept="image/*" tabindex="-1" aria-hidden="true" />
  <script src="js/config.js?v=20260821-sixfix1"></script>
  <script src="js/qrcode.min.js?v=20260816LOCKED6"></script>
  <script src="js/app.js?v=20260821-sixfix1"></script>
</body>
</html>
