# Thunder Board — static PWA + Netlify Functions
# Do NOT set a custom Build command in the Netlify UI. This file owns it.

[build]
  # No-op so Netlify never invents `npm run build` and fails with exit code 2.
  command = "node scripts/netlify-build.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Public VAPID + Supabase anon keys live in client JS by design (browser needs them).
  # Private secrets (XAI_API_KEY, VAPID_PRIVATE_KEY) exist ONLY in Netlify env — never in repo.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "js/config.js,js/app.js,index.html,README.md,package-lock.json"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,VAPID_PUBLIC_KEY,LEADER_PIN,SUPABASE_URL"
  CI = "false"
  NODE_VERSION = "18"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

[functions."enhance-memory"]
  node_bundler = "zisi"

[functions."push-gathering-tick"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/gathering.ics"
  to = "/.netlify/functions/gathering-ics"
  status = 200
  force = true

[[redirects]]
  from = "/tap"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tap/*"
  to = "/index.html"
  status = 200


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'"

# Static assets — long cache (filenames are versioned by deploy)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker must revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions."honor-sms-retry"]
  schedule = "0 * * * *"
