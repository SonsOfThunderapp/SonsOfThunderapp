# Thunder Board — static PWA + Netlify Functions
# Do NOT set a custom Build command in the Netlify UI. This file owns it.

[build]
  # Apply the exact 20260826-repair1 app.js seat-claim patch at publish, then static publish.
  command = "node scripts/netlify-build.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Public VAPID + Supabase anon keys live in client JS by design (browser needs them).
  # Private secrets (XAI_API_KEY, VAPID_PRIVATE_KEY, SUPABASE_SERVICE_ROLE_KEY) exist ONLY in Netlify env — never in repo.
  # Scan stays on; omit only known-public browser keys (not real secrets).
  SECRETS_SCAN_OMIT_PATHS = "js/config.js,js/app.js,index.html,README.md,package-lock.json"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,VAPID_PUBLIC_KEY,LEADER_PIN,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    # Real CSP (cyber handoff 2026-08-24). frame-ancestors alone is not enough.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.x.ai https://api.rss2json.com; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

# Static assets — long cache (filenames are versioned by deploy)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/js/app.js"
  [headers.values]
    Cache-Control = "no-store"

# Service worker must revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"
