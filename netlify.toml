# Thunder Board — static PWA + Netlify Functions
# NO custom build command. Do not set one in the Netlify UI either.
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Public-by-design values appear in client JS — omit from secrets fail gate
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY,SUPABASE_URL,SUPABASE_ANON_KEY"
  # Brand word "thunder" in CSS matches LEADER_PIN value — omit path, not the real secret
  SECRETS_SCAN_OMIT_PATHS = "css/styles.css,js/config.js,README.md"

[functions]
  node_bundler = "esbuild"
